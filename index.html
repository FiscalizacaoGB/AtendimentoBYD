<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel da Equipe · Atendimento BYD</title>

<style>
:root {
  --azul: #0d2f52;
  --azul-2: #164a7d;
  --azul-claro: #4ea3e8;
  --dourado: #f2b330;
  --verde: #15803d;
  --vermelho: #dc2626;
  --laranja: #d97706;
  --cinza: #f1f5f9;
  --borda: #e5e7eb;
  --texto: #1f2937;
  --suave: #6b7280;
  --fundo: #eef2f7;
}

* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: var(--fundo);
  margin: 0;
  color: var(--texto);
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  padding: 11px 14px;
  background: var(--azul);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

button:disabled { opacity: .6; cursor: wait; }

input, textarea {
  width: 100%;
  font-family: inherit;
  font-size: 15px;
  padding: 11px 12px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  background: #fff;
}

input:focus, textarea:focus {
  outline: 2px solid var(--azul-claro);
  border-color: var(--azul-claro);
}

.hidden { display: none !important; }

.ic {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
}

/* TOPO */
header {
  background: #fff;
  border-bottom: 4px solid var(--azul);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 5;
}

header img {
  height: 38px;
  max-width: 45vw;
  object-fit: contain;
}

header .titulo {
  font-weight: bold;
  color: var(--azul);
  font-size: 15px;
  border-left: 1px solid var(--borda);
  padding-left: 12px;
  line-height: 1.2;
}

header .titulo small {
  display: block;
  font-weight: normal;
  color: var(--suave);
  font-size: 12px;
}

header .direita {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.operador {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: bold;
  color: var(--azul);
}

.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--azul);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: bold;
}

.btn-icone {
  background: var(--cinza);
  color: var(--azul);
  padding: 8px;
  border-radius: 10px;
}

.btn-icone.girando .ic { animation: girar 1s linear infinite; }

@keyframes girar { to { transform: rotate(360deg); } }

@media (max-width: 640px) {
  header .titulo, .operador .nome-op { display: none; }
}

/* LOGIN */
.login {
  min-height: calc(100vh - 62px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px 16px;
  background:
    radial-gradient(circle at 15% 20%, rgba(78,163,232,.18), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(242,179,48,.18), transparent 40%),
    var(--fundo);
}

.login-box {
  background: #fff;
  border-radius: 18px;
  padding: 28px 24px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 20px 50px rgba(11,37,69,.15);
  animation: subir .35s ease-out;
}

.login-box .selo {
  width: 54px;
  height: 54px;
  border-radius: 16px;
  background: var(--azul);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
}

.login-box .selo .ic { width: 28px; height: 28px; }

.login-box h1 {
  margin: 0 0 4px;
  font-size: 22px;
  color: var(--azul);
}

.login-box p {
  margin: 0 0 18px;
  color: var(--suave);
  font-size: 14px;
}

.login-box label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  color: var(--azul);
  margin: 12px 0 4px;
}

.login-box button[type=submit] {
  width: 100%;
  margin-top: 18px;
  padding: 13px;
  font-weight: bold;
}

.erro-login {
  color: var(--vermelho);
  font-size: 13px;
  margin-top: 10px;
  min-height: 16px;
}

@keyframes subir {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}

/* PAINEL */
.painel {
  max-width: 1200px;
  margin: 0 auto;
  padding: 18px 16px 40px;
}

.saudacao {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}

.saudacao h2 {
  margin: 0;
  font-size: 22px;
  color: var(--azul);
}

.saudacao small {
  color: var(--suave);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.ponto-vivo {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 0 0 rgba(34,197,94,.6);
  animation: pulso 2s infinite;
}

@keyframes pulso {
  70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); }
  100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
}

/* RESUMO */
.kpis {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 14px;
}

@media (max-width: 860px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
}

.kpi {
  background: #fff;
  border-radius: 14px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 2px 8px rgba(11,37,69,.06);
  border: 1px solid var(--borda);
}

.kpi .kpi-ic {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  color: var(--cor);
  background: var(--fundo-kpi);
}

.kpi .kpi-ic .ic { width: 22px; height: 22px; }

.kpi strong {
  display: block;
  font-size: 26px;
  line-height: 1;
  color: #111827;
}

.kpi span {
  font-size: 12px;
  color: var(--suave);
}

/* FILTRO POR MOTIVO */
.filtros {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 14px;
}

.chip {
  flex: 0 0 auto;
  background: #fff;
  color: var(--texto);
  border: 1px solid var(--borda);
  border-radius: 20px;
  padding: 7px 12px;
  font-size: 13px;
}

.chip .ic { width: 15px; height: 15px; color: var(--cor, var(--azul)); }

.chip b {
  background: var(--cinza);
  border-radius: 10px;
  padding: 1px 7px;
  font-size: 12px;
}

.chip.ativo {
  background: var(--azul);
  color: #fff;
  border-color: var(--azul);
}

.chip.ativo .ic { color: #fff; }
.chip.ativo b { background: rgba(255,255,255,.2); }

/* DUAS COLUNAS */
.abas-moveis {
  display: none;
  gap: 8px;
  margin-bottom: 12px;
}

.abas-moveis button {
  flex: 1;
  background: #fff;
  color: var(--azul);
  border: 1px solid var(--borda);
}

.abas-moveis button.ativo {
  background: var(--azul);
  color: #fff;
}

.colunas {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  align-items: start;
}

@media (max-width: 860px) {
  .abas-moveis { display: flex; }
  .colunas { grid-template-columns: 1fr; }
  .colunas .lista-painel.oculta-movel { display: none; }
}

.lista-painel {
  background: #fff;
  border-radius: 16px;
  border: 1px solid var(--borda);
  box-shadow: 0 2px 8px rgba(11,37,69,.06);
  overflow: hidden;
}

.lista-topo {
  padding: 14px 14px 10px;
  border-bottom: 1px solid var(--borda);
}

.lista-topo h3 {
  margin: 0 0 10px;
  font-size: 16px;
  color: var(--azul);
  display: flex;
  align-items: center;
  gap: 8px;
}

.lista-topo h3 .contagem {
  background: var(--cor-cont, var(--azul));
  color: #fff;
  font-size: 12px;
  border-radius: 10px;
  padding: 2px 8px;
}

.busca { position: relative; }

.busca .ic {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: #9ca3af;
}

.busca input {
  padding-left: 36px;
  font-size: 14px;
  padding-top: 9px;
  padding-bottom: 9px;
}

.lista {
  max-height: 62vh;
  overflow-y: auto;
  padding: 8px;
}

@media (max-width: 860px) {
  .lista { max-height: none; }
}

.item {
  width: 100%;
  text-align: left;
  background: #fff;
  color: var(--texto);
  border: 1px solid var(--borda);
  border-left: 4px solid var(--cor);
  border-radius: 12px;
  padding: 11px 12px;
  margin-bottom: 8px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  transition: transform .15s, box-shadow .15s, border-color .15s;
  animation: subir .25s ease-out both;
}

.item:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 18px rgba(11,37,69,.10);
}

.item .tipo-ic {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  color: var(--cor);
  background: var(--fundo-tipo);
}

.item-meio { flex: 1; min-width: 0; }

.item-meio strong {
  display: block;
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.item-meio .motivo {
  display: block;
  font-size: 13px;
  color: var(--suave);
  margin-top: 1px;
}

.item-meio .linha-info {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  margin-top: 5px;
  font-size: 12px;
  color: var(--suave);
}

.item-meio .linha-info span {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.item-meio .linha-info .ic { width: 13px; height: 13px; }

.mono {
  font-family: "Courier New", monospace;
  font-weight: bold;
}

.idade {
  flex: 0 0 auto;
  font-size: 11px;
  font-weight: bold;
  padding: 3px 8px;
  border-radius: 10px;
  background: var(--cinza);
  color: var(--suave);
  white-space: nowrap;
}

.idade.alerta { background: #fef3c7; color: #92400e; }
.idade.atrasado { background: #fee2e2; color: #b91c1c; }
.idade.feito { background: #dcfce7; color: var(--verde); }

.novo {
  background: var(--dourado);
  color: #111827;
  font-size: 10px;
  font-weight: bold;
  border-radius: 6px;
  padding: 1px 5px;
  margin-left: 6px;
  vertical-align: 2px;
}

.vazio {
  text-align: center;
  color: var(--suave);
  padding: 36px 16px;
  font-size: 14px;
}

.vazio .ic {
  width: 40px;
  height: 40px;
  color: var(--verde);
  display: block;
  margin: 0 auto 8px;
}

.esqueleto {
  height: 74px;
  border-radius: 12px;
  margin-bottom: 8px;
  background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
  background-size: 200% 100%;
  animation: brilho 1.2s infinite;
}

@keyframes brilho { to { background-position: -200% 0; } }

/* GAVETA DO CHAMADO */
.fundo-gaveta {
  position: fixed;
  inset: 0;
  background: rgba(11,37,69,.45);
  z-index: 20;
  animation: aparecer .2s;
}

@keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }

.gaveta {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(520px, 100%);
  background: #fff;
  z-index: 21;
  display: flex;
  flex-direction: column;
  box-shadow: -20px 0 50px rgba(11,37,69,.25);
  animation: deslizar .28s ease-out;
}

@keyframes deslizar { from { transform: translateX(100%); } to { transform: none; } }

@media (max-width: 640px) {
  .gaveta {
    top: auto;
    height: 92vh;
    border-radius: 18px 18px 0 0;
    animation: deslizarCima .28s ease-out;
  }
  @keyframes deslizarCima { from { transform: translateY(100%); } to { transform: none; } }
}

.gaveta-topo {
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--borda);
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.gaveta-topo .tipo-ic {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cor);
  background: var(--fundo-tipo);
  flex: 0 0 auto;
}

.gaveta-topo .tipo-ic .ic { width: 22px; height: 22px; }

.gaveta-topo h3 {
  margin: 0;
  font-size: 18px;
  color: #111827;
}

.gaveta-topo small {
  display: block;
  color: var(--suave);
  font-size: 13px;
  margin-top: 2px;
}

.gaveta-topo .fechar {
  margin-left: auto;
  background: var(--cinza);
  color: var(--texto);
  padding: 8px;
}

.gaveta-corpo {
  padding: 16px 18px;
  overflow-y: auto;
  flex: 1;
}

.secao {
  margin-bottom: 16px;
}

.secao h4 {
  margin: 0 0 8px;
  font-size: 12px;
  text-transform: uppercase;
  color: var(--suave);
  letter-spacing: .5px;
}

.dado {
  display: flex;
  gap: 10px;
  padding: 7px 0;
  font-size: 14px;
  border-bottom: 1px dashed var(--borda);
}

.dado:last-child { border-bottom: none; }
.dado .ic { color: var(--suave); margin-top: 1px; }
.dado b { display: block; font-size: 12px; color: var(--suave); font-weight: normal; }

.acoes-contato {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.acoes-contato a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  font-size: 13px;
  font-weight: bold;
  padding: 8px 12px;
  border-radius: 10px;
  background: var(--cinza);
  color: var(--azul);
}

.acoes-contato a.whats { background: #dcfce7; color: #166534; }

.descricao {
  background: var(--cinza);
  border-radius: 12px;
  padding: 12px;
  font-size: 14px;
  white-space: pre-wrap;
  line-height: 1.45;
}

.form-atendimento {
  background: linear-gradient(180deg, #f8fafc, #fff);
  border: 1px solid var(--borda);
  border-radius: 14px;
  padding: 14px;
}

.form-atendimento label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  color: var(--azul);
  margin: 10px 0 4px;
}

.form-atendimento label:first-child { margin-top: 0; }

.form-atendimento textarea { min-height: 120px; resize: vertical; }

.respostas {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.respostas button {
  background: #fff;
  color: var(--azul);
  border: 1px dashed var(--azul-claro);
  font-size: 12px;
  padding: 5px 9px;
  border-radius: 14px;
}

.aviso-final {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--suave);
  margin-top: 10px;
}

.aviso-final .ic { width: 15px; height: 15px; }

.campo-erro { border-color: var(--vermelho) !important; background: #fef2f2 !important; }

.gaveta-rodape {
  padding: 12px 18px 16px;
  border-top: 1px solid var(--borda);
  display: flex;
  gap: 8px;
}

.gaveta-rodape .btn-finalizar {
  flex: 1;
  background: var(--verde);
  font-weight: bold;
  padding: 13px;
}

.gaveta-rodape .btn-sec {
  background: var(--cinza);
  color: var(--texto);
}

.msg-erro {
  background: #fef2f2;
  color: #991b1b;
  border-left: 4px solid var(--vermelho);
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 13px;
  margin-top: 10px;
}

.resolvido {
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  border-radius: 14px;
  padding: 14px;
}

.resolvido .dado { border-bottom-color: #bbf7d0; }

/* SUCESSO */
.sucesso {
  text-align: center;
  padding: 30px 10px;
}

.check-anim {
  width: 80px;
  height: 80px;
  display: block;
  margin: 0 auto 10px;
}

.check-anim circle {
  stroke: var(--verde);
  stroke-width: 3;
  stroke-dasharray: 151;
  stroke-dashoffset: 151;
  animation: tracar .6s ease-out forwards;
}

.check-anim path {
  stroke: var(--verde);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 34;
  stroke-dashoffset: 34;
  animation: tracar .35s .5s ease-out forwards;
}

@keyframes tracar { to { stroke-dashoffset: 0; } }

.sucesso h3 { color: var(--verde); margin: 0 0 6px; }
.sucesso p { color: var(--suave); font-size: 14px; margin: 0 0 18px; }

/* SITUAÇÃO: NA FILA / EM ATENDIMENTO */
.kpi.clicavel { cursor: pointer; transition: transform .15s, box-shadow .15s; }
.kpi.clicavel:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(11,37,69,.10); }
.kpi.ativo { border-color: var(--cor); box-shadow: 0 0 0 2px var(--cor) inset; }

.seg {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  margin-bottom: 10px;
  padding-bottom: 2px;
}

.seg button {
  flex: 0 0 auto;
  background: var(--cinza);
  color: var(--texto);
  font-size: 13px;
  padding: 6px 11px;
  border-radius: 18px;
}

.seg button b {
  background: #fff;
  border-radius: 10px;
  padding: 0 6px;
  font-size: 11px;
}

.seg button.ativo { background: var(--azul); color: #fff; }
.seg button.ativo b { background: rgba(255,255,255,.2); }

.lado {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}

.resp {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: bold;
  padding: 3px 8px;
  border-radius: 10px;
  background: #dbeafe;
  color: #1d4ed8;
  white-space: nowrap;
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.resp .ic { width: 12px; height: 12px; }
.resp.meu { background: #1d4ed8; color: #fff; }
.resp.fila { background: #fff7ed; color: #c2410c; }

.faixa-resp {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  color: #1e3a8a;
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 14px;
  margin-bottom: 10px;
}

.faixa-resp b { display: block; font-size: 12px; font-weight: normal; color: #3b82f6; }
.faixa-resp.fila { background: #fff7ed; border-color: #fed7aa; color: #7c2d12; }
.faixa-resp.fila b { color: #c2410c; }

.gaveta-rodape .btn-assumir {
  background: #eff6ff;
  color: #1d4ed8;
  font-weight: bold;
}

.gaveta.sem-anim, .fundo-gaveta.sem-anim { animation: none; }

/* ENCERRAR EM LOTE */
.lista-topo h3 .btn-lote {
  margin-left: auto;
  background: var(--cinza);
  color: var(--azul);
  font-size: 12px;
  padding: 6px 10px;
}

.lista-topo h3 .btn-lote .ic { width: 15px; height: 15px; }
body.lote .lista-topo h3 .btn-lote { background: var(--azul); color: #fff; }

.caixa {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 2px solid #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  margin-top: 7px;
  color: transparent;
  background: #fff;
}

.caixa .ic { width: 14px; height: 14px; }
.item.sel { background: #f0f9ff; border-color: #7dd3fc; }
.lista.parada .item { animation: none; }
.hz-grade.parada .rot { animation: none; }
.item.sel .caixa { background: var(--azul); border-color: var(--azul); color: #fff; }

.barra-lote {
  position: fixed;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  width: min(1168px, calc(100% - 24px));
  background: #0f172a;
  color: #fff;
  border-radius: 16px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  z-index: 15;
  box-shadow: 0 18px 40px rgba(2,6,23,.35);
  animation: subir .25s ease-out;
}

.bl-info { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.bl-info strong { font-size: 15px; }

.bl-info label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: #cbd5e1;
}

.bl-info input {
  width: auto;
  padding: 5px 8px;
  font-size: 13px;
  border-radius: 8px;
  border: none;
}

.bl-acoes { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

.bl-acoes button { font-size: 13px; padding: 8px 11px; }
.bl-acoes .bl-sec { background: rgba(255,255,255,.12); }
.bl-acoes .bl-ok { background: #22c55e; color: #052e16; font-weight: bold; }

body.lote .painel { padding-bottom: 150px; }
body.lote .toasts { bottom: 90px; }
.lista-topo h3 .btn-lote { white-space: nowrap; }

@media (max-width: 640px) {
  .barra-lote { bottom: 0; width: 100%; border-radius: 16px 16px 0 0; }
  .bl-acoes { margin-left: 0; width: 100%; }
  .bl-acoes .bl-ok { flex: 1 0 100%; padding: 12px; }
  body.lote .painel { padding-bottom: 220px; }
  body.lote .toasts { bottom: 190px; }
}

.lote-lista {
  background: var(--cinza);
  border-radius: 12px;
  padding: 6px 12px;
  font-size: 14px;
}

.lote-lista div {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 1px dashed var(--borda);
}

.lote-lista div:last-child { border-bottom: none; }
.lote-lista small { color: var(--suave); white-space: nowrap; }
.lote-lista .mais { color: var(--suave); justify-content: center; }

/* ABAS: CHAMADOS / HORÁRIOS */
.vistas {
  display: flex;
  gap: 6px;
  background: #fff;
  border: 1px solid var(--borda);
  border-radius: 14px;
  padding: 5px;
  margin-bottom: 14px;
  width: max-content;
  max-width: 100%;
  overflow-x: auto;
}

.vistas button {
  background: transparent;
  color: var(--suave);
  font-weight: bold;
  font-size: 14px;
  padding: 9px 14px;
  white-space: nowrap;
}

.vistas button.ativo {
  background: var(--azul);
  color: #fff;
  box-shadow: 0 4px 12px rgba(13,47,82,.25);
}
