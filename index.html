<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel da Equipe · Atendimento BYD</title>

<style>
:root {
  --azul: #0d2f52;
  --azul-2: #164a7d;
  --azul-claro: #4ea3e8;
  --dourado: #f2b330;
  --verde: #15803d;
  --vermelho: #dc2626;
  --laranja: #d97706;
  --cinza: #f1f5f9;
  --borda: #e5e7eb;
  --texto: #1f2937;
  --suave: #6b7280;
  --fundo: #eef2f7;
}

* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: var(--fundo);
  margin: 0;
  color: var(--texto);
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  padding: 11px 14px;
  background: var(--azul);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

button:disabled { opacity: .6; cursor: wait; }

input, textarea {
  width: 100%;
  font-family: inherit;
  font-size: 15px;
  padding: 11px 12px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  background: #fff;
}

input:focus, textarea:focus {
  outline: 2px solid var(--azul-claro);
  border-color: var(--azul-claro);
}

.hidden { display: none !important; }

.ic {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
}

/* TOPO */
header {
  background: #fff;
  border-bottom: 4px solid var(--azul);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 5;
}

header img {
  height: 38px;
  max-width: 45vw;
  object-fit: contain;
}

header .titulo {
  font-weight: bold;
  color: var(--azul);
  font-size: 15px;
  border-left: 1px solid var(--borda);
  padding-left: 12px;
  line-height: 1.2;
}

header .titulo small {
  display: block;
  font-weight: normal;
  color: var(--suave);
  font-size: 12px;
}

header .direita {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.operador {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: bold;
  color: var(--azul);
}

.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--azul);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: bold;
}

.btn-icone {
  background: var(--cinza);
  color: var(--azul);
  padding: 8px;
  border-radius: 10px;
}

.btn-icone.girando .ic { animation: girar 1s linear infinite; }

@keyframes girar { to { transform: rotate(360deg); } }

@media (max-width: 640px) {
  header .titulo, .operador .nome-op { display: none; }
}

/* LOGIN */
.login {
  min-height: calc(100vh - 62px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px 16px;
  background:
    radial-gradient(circle at 15% 20%, rgba(78,163,232,.18), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(242,179,48,.18), transparent 40%),
    var(--fundo);
}

.login-box {
  background: #fff;
  border-radius: 18px;
  padding: 28px 24px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 20px 50px rgba(11,37,69,.15);
  animation: subir .35s ease-out;
}

.login-box .selo {
  width: 54px;
  height: 54px;
  border-radius: 16px;
  background: var(--azul);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
}

.login-box .selo .ic { width: 28px; height: 28px; }

.login-box h1 {
  margin: 0 0 4px;
  font-size: 22px;
  color: var(--azul);
}

.login-box p {
  margin: 0 0 18px;
  color: var(--suave);
  font-size: 14px;
}

.login-box label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  color: var(--azul);
  margin: 12px 0 4px;
}

.login-box button[type=submit] {
  width: 100%;
  margin-top: 18px;
  padding: 13px;
  font-weight: bold;
}

.erro-login {
  color: var(--vermelho);
  font-size: 13px;
  margin-top: 10px;
  min-height: 16px;
}

@keyframes subir {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}

/* PAINEL */
.painel {
  max-width: 1200px;
  margin: 0 auto;
  padding: 18px 16px 40px;
}

.saudacao {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}

.saudacao h2 {
  margin: 0;
  font-size: 22px;
  color: var(--azul);
}

.saudacao small {
  color: var(--suave);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.ponto-vivo {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 0 0 rgba(34,197,94,.6);
  animation: pulso 2s infinite;
}

@keyframes pulso {
  70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); }
  100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
}

/* RESUMO */
.kpis {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 14px;
}

@media (max-width: 860px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
}

.kpi {
  background: #fff;
  border-radius: 14px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 2px 8px rgba(11,37,69,.06);
  border: 1px solid var(--borda);
}

.kpi .kpi-ic {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  color: var(--cor);
  background: var(--fundo-kpi);
}

.kpi .kpi-ic .ic { width: 22px; height: 22px; }

.kpi strong {
  display: block;
  font-size: 26px;
  line-height: 1;
  color: #111827;
}

.kpi span {
  font-size: 12px;
  color: var(--suave);
}

/* FILTRO POR MOTIVO */
.filtros {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 14px;
}

.chip {
  flex: 0 0 auto;
  background: #fff;
  color: var(--texto);
  border: 1px solid var(--borda);
  border-radius: 20px;
  padding: 7px 12px;
  font-size: 13px;
}

.chip .ic { width: 15px; height: 15px; color: var(--cor, var(--azul)); }

.chip b {
  background: var(--cinza);
  border-radius: 10px;
  padding: 1px 7px;
  font-size: 12px;
}

.chip.ativo {
  background: var(--azul);
  color: #fff;
  border-color: var(--azul);
}

.chip.ativo .ic { color: #fff; }
.chip.ativo b { background: rgba(255,255,255,.2); }

/* DUAS COLUNAS */
.abas-moveis {
  display: none;
  gap: 8px;
  margin-bottom: 12px;
}

.abas-moveis button {
  flex: 1;
  background: #fff;
  color: var(--azul);
  border: 1px solid var(--borda);
}

.abas-moveis button.ativo {
  background: var(--azul);
  color: #fff;
}

.colunas {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  align-items: start;
}

@media (max-width: 860px) {
  .abas-moveis { display: flex; }
  .colunas { grid-template-columns: 1fr; }
  .colunas .lista-painel.oculta-movel { display: none; }
}

.lista-painel {
  background: #fff;
  border-radius: 16px;
  border: 1px solid var(--borda);
  box-shadow: 0 2px 8px rgba(11,37,69,.06);
  overflow: hidden;
}

.lista-topo {
  padding: 14px 14px 10px;
  border-bottom: 1px solid var(--borda);
}

.lista-topo h3 {
  margin: 0 0 10px;
  font-size: 16px;
  color: var(--azul);
  display: flex;
  align-items: center;
  gap: 8px;
}

.lista-topo h3 .contagem {
  background: var(--cor-cont, var(--azul));
  color: #fff;
  font-size: 12px;
  border-radius: 10px;
  padding: 2px 8px;
}

.busca { position: relative; }

.busca .ic {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: #9ca3af;
}

.busca input {
  padding-left: 36px;
  font-size: 14px;
  padding-top: 9px;
  padding-bottom: 9px;
}

.lista {
  max-height: 62vh;
  overflow-y: auto;
  padding: 8px;
}

@media (max-width: 860px) {
  .lista { max-height: none; }
}

.item {
  width: 100%;
  text-align: left;
  background: #fff;
  color: var(--texto);
  border: 1px solid var(--borda);
  border-left: 4px solid var(--cor);
  border-radius: 12px;
  padding: 11px 12px;
  margin-bottom: 8px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  transition: transform .15s, box-shadow .15s, border-color .15s;
  animation: subir .25s ease-out both;
}

.item:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 18px rgba(11,37,69,.10);
}

.item .tipo-ic {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  color: var(--cor);
  background: var(--fundo-tipo);
}

.item-meio { flex: 1; min-width: 0; }

.item-meio strong {
  display: block;
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.item-meio .motivo {
  display: block;
  font-size: 13px;
  color: var(--suave);
  margin-top: 1px;
}

.item-meio .linha-info {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  margin-top: 5px;
  font-size: 12px;
  color: var(--suave);
}

.item-meio .linha-info span {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.item-meio .linha-info .ic { width: 13px; height: 13px; }

.mono {
  font-family: "Courier New", monospace;
  font-weight: bold;
}

.idade {
  flex: 0 0 auto;
  font-size: 11px;
  font-weight: bold;
  padding: 3px 8px;
  border-radius: 10px;
  background: var(--cinza);
  color: var(--suave);
  white-space: nowrap;
}

.idade.alerta { background: #fef3c7; color: #92400e; }
.idade.atrasado { background: #fee2e2; color: #b91c1c; }
.idade.feito { background: #dcfce7; color: var(--verde); }

.novo {
  background: var(--dourado);
  color: #111827;
  font-size: 10px;
  font-weight: bold;
  border-radius: 6px;
  padding: 1px 5px;
  margin-left: 6px;
  vertical-align: 2px;
}

.vazio {
  text-align: center;
  color: var(--suave);
  padding: 36px 16px;
  font-size: 14px;
}

.vazio .ic {
  width: 40px;
  height: 40px;
  color: var(--verde);
  display: block;
  margin: 0 auto 8px;
}

.esqueleto {
  height: 74px;
  border-radius: 12px;
  margin-bottom: 8px;
  background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
  background-size: 200% 100%;
  animation: brilho 1.2s infinite;
}

@keyframes brilho { to { background-position: -200% 0; } }

/* GAVETA DO CHAMADO */
.fundo-gaveta {
  position: fixed;
  inset: 0;
  background: rgba(11,37,69,.45);
  z-index: 20;
  animation: aparecer .2s;
}

@keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }

.gaveta {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(520px, 100%);
  background: #fff;
  z-index: 21;
  display: flex;
  flex-direction: column;
  box-shadow: -20px 0 50px rgba(11,37,69,.25);
  animation: deslizar .28s ease-out;
}

@keyframes deslizar { from { transform: translateX(100%); } to { transform: none; } }

@media (max-width: 640px) {
  .gaveta {
    top: auto;
    height: 92vh;
    border-radius: 18px 18px 0 0;
    animation: deslizarCima .28s ease-out;
  }
  @keyframes deslizarCima { from { transform: translateY(100%); } to { transform: none; } }
}

.gaveta-topo {
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--borda);
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.gaveta-topo .tipo-ic {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cor);
  background: var(--fundo-tipo);
  flex: 0 0 auto;
}

.gaveta-topo .tipo-ic .ic { width: 22px; height: 22px; }

.gaveta-topo h3 {
  margin: 0;
  font-size: 18px;
  color: #111827;
}

.gaveta-topo small {
  display: block;
  color: var(--suave);
  font-size: 13px;
  margin-top: 2px;
}

.gaveta-topo .fechar {
  margin-left: auto;
  background: var(--cinza);
  color: var(--texto);
  padding: 8px;
}

.gaveta-corpo {
  padding: 16px 18px;
  overflow-y: auto;
  flex: 1;
}

.secao {
  margin-bottom: 16px;
}

.secao h4 {
  margin: 0 0 8px;
  font-size: 12px;
  text-transform: uppercase;
  color: var(--suave);
  letter-spacing: .5px;
}

.dado {
  display: flex;
  gap: 10px;
  padding: 7px 0;
  font-size: 14px;
  border-bottom: 1px dashed var(--borda);
}

.dado:last-child { border-bottom: none; }
.dado .ic { color: var(--suave); margin-top: 1px; }
.dado b { display: block; font-size: 12px; color: var(--suave); font-weight: normal; }

.acoes-contato {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.acoes-contato a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  font-size: 13px;
  font-weight: bold;
  padding: 8px 12px;
  border-radius: 10px;
  background: var(--cinza);
  color: var(--azul);
}

.acoes-contato a.whats { background: #dcfce7; color: #166534; }

.descricao {
  background: var(--cinza);
  border-radius: 12px;
  padding: 12px;
  font-size: 14px;
  white-space: pre-wrap;
  line-height: 1.45;
}

.form-atendimento {
  background: linear-gradient(180deg, #f8fafc, #fff);
  border: 1px solid var(--borda);
  border-radius: 14px;
  padding: 14px;
}

.form-atendimento label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  color: var(--azul);
  margin: 10px 0 4px;
}

.form-atendimento label:first-child { margin-top: 0; }

.form-atendimento textarea { min-height: 120px; resize: vertical; }

.respostas {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.respostas button {
  background: #fff;
  color: var(--azul);
  border: 1px dashed var(--azul-claro);
  font-size: 12px;
  padding: 5px 9px;
  border-radius: 14px;
}

.aviso-final {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--suave);
  margin-top: 10px;
}

.aviso-final .ic { width: 15px; height: 15px; }

.campo-erro { border-color: var(--vermelho) !important; background: #fef2f2 !important; }

.gaveta-rodape {
  padding: 12px 18px 16px;
  border-top: 1px solid var(--borda);
  display: flex;
  gap: 8px;
}

.gaveta-rodape .btn-finalizar {
  flex: 1;
  background: var(--verde);
  font-weight: bold;
  padding: 13px;
}

.gaveta-rodape .btn-sec {
  background: var(--cinza);
  color: var(--texto);
}

.msg-erro {
  background: #fef2f2;
  color: #991b1b;
  border-left: 4px solid var(--vermelho);
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 13px;
  margin-top: 10px;
}

.resolvido {
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  border-radius: 14px;
  padding: 14px;
}

.resolvido .dado { border-bottom-color: #bbf7d0; }

/* SUCESSO */
.sucesso {
  text-align: center;
  padding: 30px 10px;
}

.check-anim {
  width: 80px;
  height: 80px;
  display: block;
  margin: 0 auto 10px;
}

.check-anim circle {
  stroke: var(--verde);
  stroke-width: 3;
  stroke-dasharray: 151;
  stroke-dashoffset: 151;
  animation: tracar .6s ease-out forwards;
}

.check-anim path {
  stroke: var(--verde);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 34;
  stroke-dashoffset: 34;
  animation: tracar .35s .5s ease-out forwards;
}

@keyframes tracar { to { stroke-dashoffset: 0; } }

.sucesso h3 { color: var(--verde); margin: 0 0 6px; }
.sucesso p { color: var(--suave); font-size: 14px; margin: 0 0 18px; }

/* AVISOS FLUTUANTES */
.toasts {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 40;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  width: max-content;
  max-width: calc(100% - 32px);
}

.toast {
  background: #111827;
  color: #fff;
  padding: 11px 16px;
  border-radius: 12px;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  animation: subir .25s ease-out;
}

.toast .ic { color: #4ade80; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .check-anim circle, .check-anim path { stroke-dashoffset: 0; }
}
</style>
</head>

<!-- LOGIN -->
<section class="login" id="telaLogin">
  <form class="login-box" onsubmit="entrar(event)">
    <div class="selo"><i data-ic="headset"></i></div>
    <h1>Painel da Equipe</h1>
    <p>Entre para ver e responder os chamados dos passageiros.</p>
    <label for="lNome">Seu nome</label>
    <input type="text" id="lNome" autocomplete="name" maxlength="80" placeholder="Como vai aparecer em Atendimento">
    <label for="lSenha">Senha da equipe</label>
    <input type="password" id="lSenha" autocomplete="current-password">
    <button type="submit" id="btnEntrar"><i data-ic="login"></i><span>Entrar</span></button>
    <div class="erro-login" id="erroLogin"></div>
  </form>
</section>

<!-- PAINEL -->
<main class="painel hidden" id="telaPainel">

  <div class="saudacao">
    <h2 id="saudacao"></h2>
    <small><span class="ponto-vivo"></span><span id="atualizadoEm">Carregando...</span></small>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="filtros" id="filtros"></div>

  <div class="abas-moveis">
    <button class="ativo" data-aba="abertos" onclick="abaMovel('abertos')">Em aberto</button>
    <button data-aba="historico" onclick="abaMovel('historico')">Histórico</button>
  </div>

  <div class="colunas">
    <section class="lista-painel" id="painelAbertos" style="--cor-cont: var(--laranja)">
      <div class="lista-topo">
        <h3><i data-ic="inbox"></i>Atendimentos em aberto <span class="contagem" id="contAbertos">0</span></h3>
        <div class="busca"><i data-ic="search"></i><input type="search" id="buscaAbertos" placeholder="Buscar por nome, protocolo, roteiro..." oninput="desenharListas()"></div>
      </div>
      <div class="lista" id="listaAbertos"></div>
    </section>

    <section class="lista-painel oculta-movel" id="painelHistorico" style="--cor-cont: var(--verde)">
      <div class="lista-topo">
        <h3><i data-ic="history"></i>Histórico de atendimentos <span class="contagem" id="contHistorico">0</span></h3>
        <div class="busca"><i data-ic="search"></i><input type="search" id="buscaHistorico" placeholder="Buscar por nome, protocolo, atendente..." oninput="desenharListas()"></div>
      </div>
      <div class="lista" id="listaHistorico"></div>
    </section>
  </div>
</main>

function ic(nome) {
  return `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONES[nome] || ""}</svg>`;
}

function pintarIcones() {
  document.querySelectorAll("i[data-ic]").forEach(i => { i.outerHTML = ic(i.dataset.ic); });
}

function esc(txt) {
  return String(txt || "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function normalizar(txt) {
  return String(txt || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}

/* ESTADO */

let operador = "";
let dados = { abertos: [], historico: [], totalFinalizados: 0 };

let novos = new Set();
let timer = null;
let abertoNaGaveta = null;

function tipoDe(valor) {
  return TIPOS.find(t => t.valor === valor) || Object.assign({}, TIPO_PADRAO, { curto: valor || TIPO_PADRAO.curto });
}

/* API */
function chamarApi(corpo) {

    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ senha }, corpo))
  })

  .then(r => r.text())
  .then(txt => {
    try { return JSON.parse(txt); }
    catch (e) { throw new Error("O Apps Script não devolveu JSON. Confira se a implantação está na versão nova."); }
  });
}

/* LOGIN */
function entrar(ev) {
  ev.preventDefault();
  const nome = document.getElementById("lNome").value.trim();
  const s = document.getElementById("lSenha").value;
  const erro = document.getElementById("erroLogin");
  const btn = document.getElementById("btnEntrar");
  if (nome.length < 2) { erro.textContent = "Digite seu nome."; return; }
  if (!s) { erro.textContent = "Digite a senha da equipe."; return; }

  erro.textContent = "";
  btn.disabled = true;
  senha = s;
  chamarApi({ acao: "entrarEquipe" })
    .then(r => {
      if (!r.ok) throw new Error(r.erro || "Não foi possível entrar.");
      operador = nome;
      try {
        localStorage.setItem("equipeBydNome", nome);
        sessionStorage.setItem("equipeBydSenha", s);
      } catch (e) {}
      abrirPainel();
    })
    .catch(err => { senha = ""; erro.textContent = err.message; })
    .finally(() => { btn.disabled = false; });
}

function sair() {
  try { sessionStorage.removeItem("equipeBydSenha"); } catch (e) {}
  senha = "";
  clearInterval(timer);
  fecharGaveta();
  document.getElementById("telaPainel").classList.add("hidden");
  document.getElementById("topoLogado").classList.add("hidden");
  document.getElementById("telaLogin").classList.remove("hidden");
  document.getElementById("lSenha").value = "";
}

function abrirPainel() {
  document.getElementById("telaLogin").classList.add("hidden");
  document.getElementById("telaPainel").classList.remove("hidden");
  document.getElementById("topoLogado").classList.remove("hidden");
  document.getElementById("nomeOp").textContent = operador;
  document.getElementById("avatar").textContent = iniciais(operador);
  const h = new Date().getHours();
  document.getElementById("saudacao").textContent =
    (h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite") + ", " + operador.split(" ")[0] + "!";
  mostrarEsqueleto();
  carregar(false);
  clearInterval(timer);
  timer = setInterval(() => carregar(false, true), ATUALIZAR_A_CADA);
}

function iniciais(nome) {
  const p = nome.trim().split(/\s+/);
  return ((p[0] || "")[0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase();
}

/* CARREGAR DADOS */
function carregar(manual, silencioso) {
  const btn = document.getElementById("btnAtualizar");
  btn.classList.add("girando");
  return chamarApi({ acao: "painel" })
    .then(r => {
      if (r.senha === false) { sair(); document.getElementById("erroLogin").textContent = r.erro; return; }
      if (!r.ok) throw new Error(r.erro || "Erro ao carregar.");

      // marca os chamados que chegaram desde a última atualização
      const ids = new Set(r.abertos.map(c => c.id));
      if (idsConhecidos) {
        const chegaram = r.abertos.filter(c => !idsConhecidos.has(c.id));
        chegaram.forEach(c => novos.add(c.id));
        if (chegaram.length) toast(chegaram.length === 1 ? "1 novo chamado chegou" : chegaram.length + " novos chamados chegaram", "inbox");
      }
      idsConhecidos = ids;

      dados = r;
      document.getElementById("atualizadoEm").textContent = "Atualizado às " + hora(new Date()) + " · atualiza sozinho a cada minuto";
      desenharTudo();
      if (manual) toast("Painel atualizado", "check");
    })
    .catch(err => {
      if (!silencioso) toast(err.message, "alert", true);
      document.getElementById("atualizadoEm").textContent = "Falha ao atualizar: " + err.message;
    })
    .finally(() => btn.classList.remove("girando"));
}

function mostrarEsqueleto() {
  const sk = '<div class="esqueleto"></div>'.repeat(4);
  document.getElementById("listaAbertos").innerHTML = sk;
  document.getElementById("listaHistorico").innerHTML = sk;
}

/* DATAS */
function hora(d) {
  return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

function horasDesde(iso) {
  return iso ? (Date.now() - new Date(iso).getTime()) / 36e5 : null;
}

function tempoRelativo(iso) {
  if (!iso) return "";
  const min = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (min < 1) return "agora";
  if (min < 60) return "há " + min + " min";
  const h = Math.floor(min / 60);
  if (h < 24) return "há " + h + " h";
  const d = Math.floor(h / 24);
  return "há " + d + (d === 1 ? " dia" : " dias");
}

function mesmoDia(iso, ref) {
  if (!iso) return false;
  const d = new Date(iso);
  return d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth() && d.getDate() === ref.getDate();
}

/* DESENHO */
function desenharTudo() {
  desenharKpis();
  desenharFiltros();
  desenharListas();
}

function desenharKpis() {
  const hoje = new Date();
  const atrasados = dados.abertos.filter(c => (horasDesde(c.abertoEm) || 0) >= 24).length;
  const finalizadosHoje = dados.historico.filter(c => mesmoDia(c.finalizadoEm, hoje)).length;
  const kpis = [
    { n: dados.abertos.length, rotulo: "Em aberto", icone: "inbox", cor: "#d97706", fundo: "#fffbeb" },
    { n: atrasados, rotulo: "Aguardando há +24h", icone: "alert", cor: "#dc2626", fundo: "#fef2f2" },
    { n: finalizadosHoje, rotulo: "Finalizados hoje", icone: "today", cor: "#15803d", fundo: "#f0fdf4" },
    { n: dados.totalFinalizados, rotulo: "Total finalizados", icone: "total", cor: "#0d2f52", fundo: "#eff6ff" }
  ];
  const box = document.getElementById("kpis");
  box.innerHTML = kpis.map(k => `
    <div class="kpi" style="--cor:${k.cor};--fundo-kpi:${k.fundo}">
      <div class="kpi-ic">${ic(k.icone)}</div>
      <div><strong data-alvo="${k.n}">0</strong><span>${k.rotulo}</span></div>
    </div>`).join("");
  box.querySelectorAll("strong[data-alvo]").forEach(contarAte);
}

/* Número sobe de 0 até o valor */
function contarAte(el) {
  const alvo = Number(el.dataset.alvo) || 0;
  const inicio = performance.now();
  const passo = agora => {
    const p = Math.min(1, (agora - inicio) / 600);
    el.textContent = Math.round(alvo * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
}

function desenharFiltros() {
  const cont = {};
  dados.abertos.forEach(c => { const k = tipoDe(c.tipo).curto; cont[k] = (cont[k] || 0) + 1; });
  const chips = [`<button class="chip ${!filtroTipo ? "ativo" : ""}" onclick="filtrar('')">Todos <b>${dados.abertos.length}</b></button>`]
    .concat(TIPOS.map(t => `
      <button class="chip ${filtroTipo === t.curto ? "ativo" : ""}" style="--cor:${t.cor}" onclick="filtrar('${t.curto}')">
        ${ic(t.icone)}${t.curto} <b>${cont[t.curto] || 0}</b>
      </button>`));
  document.getElementById("filtros").innerHTML = chips.join("");
}

function filtrar(curto) {
  filtroTipo = curto;
  desenharFiltros();
  desenharListas();
}

function bate(c, termo) {
  if (!termo) return true;
  return normalizar([c.nome, c.protocolo, c.roteiro, c.telefone, c.endereco, c.atendente, c.descricao].join(" ")).indexOf(termo) > -1;
}

function desenharListas() {
  const tAb = normalizar(document.getElementById("buscaAbertos").value.trim());
  const tHi = normalizar(document.getElementById("buscaHistorico").value.trim());
  const porTipo = c => !filtroTipo || tipoDe(c.tipo).curto === filtroTipo;

  // em aberto: os mais antigos primeiro (quem espera há mais tempo)
  const abertos = dados.abertos.filter(c => porTipo(c) && bate(c, tAb))
    .sort((a, b) => (a.abertoEm || "").localeCompare(b.abertoEm || "") || a.linha - b.linha);
  const historico = dados.historico.filter(c => porTipo(c) && bate(c, tHi));

  document.getElementById("contAbertos").textContent = dados.abertos.length;
  document.getElementById("contHistorico").textContent = dados.totalFinalizados;
  document.querySelector('.abas-moveis [data-aba="abertos"]').textContent = "Em aberto (" + dados.abertos.length + ")";

  document.getElementById("listaAbertos").innerHTML = abertos.length
    ? abertos.map((c, i) => itemHtml(c, i, false)).join("")
    : `<div class="vazio">${ic("checkCirc")}${dados.abertos.length ? "Nenhum chamado com esse filtro." : "Tudo em dia! Nenhum atendimento em aberto."}</div>`;

  document.getElementById("listaHistorico").innerHTML = historico.length
    ? historico.slice(0, 100).map((c, i) => itemHtml(c, i, true)).join("")
    : `<div class="vazio">Nenhum atendimento no histórico${tHi || filtroTipo ? " com esse filtro" : ""}.</div>`;
}

function itemHtml(c, i, finalizado) {
  const t = tipoDe(c.tipo);
  const h = horasDesde(c.abertoEm);
  const classeIdade = finalizado ? "feito" : h >= 24 ? "atrasado" : h >= 4 ? "alerta" : "";
  const idade = finalizado
    ? (c.finalizadoEm ? tempoRelativo(c.finalizadoEm) : c.finalizadoTxt.split(" ")[0])
    : (c.abertoEm ? tempoRelativo(c.abertoEm) : c.abertoTxt.split(" ")[0]);
  return `
    <button class="item" style="--cor:${t.cor};--fundo-tipo:${t.fundo};animation-delay:${Math.min(i, 10) * 30}ms"
            onclick="abrirGaveta('${esc(c.id)}', ${finalizado})">
      <span class="tipo-ic">${ic(t.icone)}</span>
      <span class="item-meio">
        <strong>${esc(c.nome) || "(sem nome)"}${!finalizado && novos.has(c.id) ? '<span class="novo">NOVO</span>' : ""}</strong>
        <span class="motivo">${esc(t.curto)}</span>
        <span class="linha-info">
          ${c.protocolo ? `<span class="mono">${esc(c.protocolo)}</span>` : `<span>linha ${c.linha}</span>`}
          ${c.roteiro ? `<span>${ic("bus")}${esc(c.roteiro)}</span>` : ""}
          ${finalizado && c.atendente ? `<span>${ic("user")}${esc(c.atendente)}</span>` : ""}
        </span>
      </span>
      <span class="idade ${classeIdade}">${esc(idade)}</span>
    </button>`;
}

function abaMovel(aba) {
  document.querySelectorAll(".abas-moveis button").forEach(b => b.classList.toggle("ativo", b.dataset.aba === aba));
  document.getElementById("painelAbertos").classList.toggle("oculta-movel", aba !== "abertos");
  document.getElementById("painelHistorico").classList.toggle("oculta-movel", aba !== "historico");
}

/* GAVETA: DETALHES + FORMULÁRIO */
function acharChamado(id, finalizado) {
  return (finalizado ? dados.historico : dados.abertos).find(c => c.id === id);
}

function linkWhats(tel) {
  let d = String(tel || "").replace(/\D/g, "");
  if (d.length === 10 || d.length === 11) d = "55" + d;
  return d.length >= 12 ? "https://wa.me/" + d : "";
}

function abrirGaveta(id, finalizado) {
  const c = acharChamado(id, finalizado);
  if (!c) return;
  abertoNaGaveta = c;
  novos.delete(c.id);
  const t = tipoDe(c.tipo);
  const whats = linkWhats(c.telefone);
  const tel = String(c.telefone || "").replace(/[^\d+]/g, "");
  const maps = /^https?:\/\//i.test(c.localizacao) ? c.localizacao : "";
  const mapsEndereco = c.endereco ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(c.endereco) : "";

  document.getElementById("gaveta").innerHTML = `
    <div class="fundo-gaveta" onclick="fecharGaveta()"></div>
    <aside class="gaveta" role="dialog" aria-modal="true" style="--cor:${t.cor};--fundo-tipo:${t.fundo}">
      <div class="gaveta-topo">
        <span class="tipo-ic">${ic(t.icone)}</span>
        <div>
          <h3>${esc(c.nome) || "(sem nome)"}</h3>
          <small>${esc(t.curto)} · ${c.protocolo ? `<span class="mono">${esc(c.protocolo)}</span>` : "linha " + c.linha}</small>
        </div>
        <button class="fechar" onclick="fecharGaveta()" aria-label="Fechar">${ic("close")}</button>
      </div>

      <div class="gaveta-corpo" id="gavetaCorpo">
        <div class="secao">
          <h4>Chamado</h4>
          <div class="dado">${ic("clock")}<div><b>Aberto em</b>${esc(c.abertoTxt) || "-"} ${c.abertoEm ? `· ${tempoRelativo(c.abertoEm)}` : ""}</div></div>
          <div class="dado">${ic(t.icone)}<div><b>Solicitação</b>${esc(c.tipo) || "-"}</div></div>
          ${c.roteiro ? `<div class="dado">${ic("bus")}<div><b>Roteiro</b>${esc(c.roteiro)}</div></div>` : ""}
        </div>

        <div class="secao">
          <h4>Contato</h4>
          <div class="dado">${ic("phone")}<div><b>Telefone</b>${esc(c.telefone) || "-"}</div></div>
          <div class="dado">${ic("home")}<div><b>Endereço</b>${esc(c.endereco) || "-"}</div></div>
          <div class="acoes-contato">
            ${whats ? `<a class="whats" href="${whats}" target="_blank" rel="noopener">${ic("whats")}WhatsApp</a>` : ""}
            ${tel ? `<a href="tel:${esc(tel)}">${ic("phone")}Ligar</a>` : ""}
            ${maps ? `<a href="${esc(maps)}" target="_blank" rel="noopener">${ic("pin")}Localização enviada</a>` : ""}
            ${mapsEndereco ? `<a href="${mapsEndereco}" target="_blank" rel="noopener">${ic("map")}Endereço no Maps</a>` : ""}
          </div>
        </div>

        <div class="secao">
          <h4>Descrição do passageiro</h4>
          <div class="descricao">${esc(c.descricao) || "(sem descrição)"}</div>
        </div>

        ${finalizado ? `
          <div class="secao">
            <h4>Atendimento</h4>
            <div class="resolvido">
              <div class="dado">${ic("user")}<div><b>Atendido por</b>${esc(c.atendente) || "-"}</div></div>
              <div class="dado">${ic("text")}<div><b>Providência</b><span style="white-space:pre-wrap">${esc(c.providencia) || "-"}</span></div></div>
              <div class="dado">${ic("checkCirc")}<div><b>Finalizado em</b>${esc(c.finalizadoTxt) || "-"}</div></div>
            </div>
          </div>` : `
          <div class="secao">
            <h4>Registrar atendimento</h4>
            <div class="form-atendimento">
              <label for="gAtendente">Atendimento (seu nome)</label>
              <input type="text" id="gAtendente" maxlength="80" value="${esc(operador)}">
              <label for="gProvidencia">Providência (o que foi resolvido)</label>
              <textarea id="gProvidencia" maxlength="2000" placeholder="Descreva o que foi feito para resolver o chamado"></textarea>
              <div class="respostas">
                ${RESPOSTAS_RAPIDAS.map((r, i) => `<button type="button" onclick="usarResposta(${i})">+ ${esc(r)}</button>`).join("")}
              </div>
              <div class="aviso-final">${ic("clock")}Ao finalizar, a data e hora são gravadas em "Finalizado" automaticamente.</div>
              <div id="gErro"></div>
            </div>
          </div>`}
      </div>

      ${finalizado ? "" : `
        <div class="gaveta-rodape" id="gavetaRodape">
          <button class="btn-sec" onclick="fecharGaveta()">Cancelar</button>
          <button class="btn-finalizar" id="btnFinalizar" onclick="finalizar()">${ic("send")}<span>Finalizar atendimento</span></button>
        </div>`}
    </aside>`;
  desenharListas();
  const campo = document.getElementById("gProvidencia");
  if (campo) setTimeout(() => campo.focus(), 300);
}

function fecharGaveta() {
  abertoNaGaveta = null;
  document.getElementById("gaveta").innerHTML = "";
}

document.addEventListener("keydown", e => { if (e.key === "Escape") fecharGaveta(); });

function usarResposta(i) {
  const campo = document.getElementById("gProvidencia");
  const atual = campo.value.trim();
  campo.value = (atual ? atual + " " : "") + RESPOSTAS_RAPIDAS[i];
  campo.classList.remove("campo-erro");
  campo.focus();
}

function finalizar() {
  const c = abertoNaGaveta;
  if (!c) return;
  const at = document.getElementById("gAtendente");
  const pr = document.getElementById("gProvidencia");
  const erro = document.getElementById("gErro");
  at.classList.toggle("campo-erro", at.value.trim().length < 2);
  pr.classList.toggle("campo-erro", pr.value.trim().length < 3);
  if (at.value.trim().length < 2 || pr.value.trim().length < 3) {
    erro.innerHTML = `<div class="msg-erro">Preencha o atendente e a providência.</div>`;
    return;
  }

  const btn = document.getElementById("btnFinalizar");
  btn.disabled = true;
  btn.querySelector("span").textContent = "Gravando...";
  erro.innerHTML = "";

  chamarApi({
    acao: "finalizarChamado",
    id: c.id,
    conferir: c.abertoTxt,
    atendente: at.value.trim(),
    providencia: pr.value.trim()
  })
  .then(r => {
    if (r.senha === false) { sair(); return; }
    if (!r.ok) {
      if (r.jaFinalizado) carregar(false, true);
      throw new Error(r.erro || "Não foi possível gravar.");
    }
    // tira da lista de abertos e coloca no histórico na hora, sem esperar recarregar
    dados.abertos = dados.abertos.filter(x => x.id !== c.id);
    dados.historico.unshift(Object.assign({}, c, {
      atendente: at.value.trim(),
      providencia: pr.value.trim(),
      finalizadoEm: r.finalizadoEm,
      finalizadoTxt: r.finalizadoTxt
    }));
    dados.totalFinalizados++;
    desenharTudo();
    mostrarSucessoGaveta(c, r.finalizadoTxt);
    toast("Atendimento de " + (c.nome.split(" ")[0] || "passageiro") + " finalizado", "check");
  })
  .catch(err => {
    erro.innerHTML = `<div class="msg-erro">${esc(err.message)}</div>`;
    btn.disabled = false;
    btn.querySelector("span").textContent = "Finalizar atendimento";
  });
}

function mostrarSucessoGaveta(c, quando) {
  document.getElementById("gavetaRodape").remove();
  const proximo = dados.abertos
    .slice().sort((a, b) => (a.abertoEm || "").localeCompare(b.abertoEm || "") || a.linha - b.linha)[0];
  document.getElementById("gavetaCorpo").innerHTML = `
    <div class="sucesso">
      <svg class="check-anim" viewBox="0 0 52 52" aria-hidden="true">
        <circle cx="26" cy="26" r="24" fill="none"/>
        <path fill="none" d="M15 27l7 7 15-15"/>
      </svg>
      <h3>Atendimento finalizado!</h3>
      <p>Gravado na planilha em ${esc(quando)}.${c.protocolo ? "<br>O passageiro já vê a resposta ao consultar o protocolo." : ""}</p>
      ${proximo ? `<button onclick="abrirGaveta('${esc(proximo.id)}', false)">Próximo chamado em aberto ${ic("send")}</button><br><br>` : ""}
      <button class="btn-sec" style="background:var(--cinza);color:var(--texto)" onclick="fecharGaveta()">Voltar ao painel</button>
    </div>`;
}

/* AVISOS */
function toast(texto, icone, erro) {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = ic(icone || "check") + `<span>${esc(texto)}</span>`;
  if (erro) el.querySelector(".ic").style.color = "#f87171";
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), erro ? 6000 : 3000);
}

/* INÍCIO: se a aba ainda tem a senha da sessão, entra direto */
document.addEventListener("DOMContentLoaded", () => {
  pintarIcones();
  try {
    document.getElementById("lNome").value = localStorage.getItem("equipeBydNome") || "";
    const s = sessionStorage.getItem("equipeBydSenha");
    if (s && document.getElementById("lNome").value) {
      senha = s;
      operador = document.getElementById("lNome").value;
      abrirPainel();
    }
  } catch (e) {}
});
</script>
