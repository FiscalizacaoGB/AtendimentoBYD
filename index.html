<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel da Equipe · Atendimento BYD</title>

<style>
:root {
  --azul: #0d2f52;
  --azul-2: #164a7d;
  --azul-claro: #4ea3e8;
  --dourado: #f2b330;
  --verde: #15803d;
  --vermelho: #dc2626;
  --laranja: #d97706;
  --cinza: #f1f5f9;
  --borda: #e5e7eb;
  --texto: #1f2937;
  --suave: #6b7280;
  --fundo: #eef2f7;
}

* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: var(--fundo);
  margin: 0;
  color: var(--texto);
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  padding: 11px 14px;
  background: var(--azul);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

button:disabled { opacity: .6; cursor: wait; }

input, textarea {
  width: 100%;
  font-family: inherit;
  font-size: 15px;
  padding: 11px 12px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  background: #fff;
}

input:focus, textarea:focus {
  outline: 2px solid var(--azul-claro);
  border-color: var(--azul-claro);
}

.hidden { display: none !important; }

.ic {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
}

/* TOPO */
header {
  background: #fff;
  border-bottom: 4px solid var(--azul);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 5;
}

header img {
  height: 38px;
  max-width: 45vw;
  object-fit: contain;
}

header .titulo {
  font-weight: bold;
  color: var(--azul);
  font-size: 15px;
  border-left: 1px solid var(--borda);
  padding-left: 12px;
  line-height: 1.2;
}

header .titulo small {
  display: block;
  font-weight: normal;
  color: var(--suave);
  font-size: 12px;
}

header .direita {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.operador {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: bold;
  color: var(--azul);
}

.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--azul);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: bold;
}

.btn-icone {
  background: var(--cinza);
  color: var(--azul);
  padding: 8px;
  border-radius: 10px;
}

.btn-icone.girando .ic { animation: girar 1s linear infinite; }

@keyframes girar { to { transform: rotate(360deg); } }

@media (max-width: 640px) {
  header .titulo, .operador .nome-op { display: none; }
}

/* LOGIN */
.login {
  min-height: calc(100vh - 62px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px 16px;
  background:
    radial-gradient(circle at 15% 20%, rgba(78,163,232,.18), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(242,179,48,.18), transparent 40%),
    var(--fundo);
}

.login-box {
  background: #fff;
  border-radius: 18px;
  padding: 28px 24px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 20px 50px rgba(11,37,69,.15);
  animation: subir .35s ease-out;
}

.login-box .selo {
  width: 54px;
  height: 54px;
  border-radius: 16px;
  background: var(--azul);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
}

.login-box .selo .ic { width: 28px; height: 28px; }

.login-box h1 {
  margin: 0 0 4px;
  font-size: 22px;
  color: var(--azul);
}

.login-box p {
  margin: 0 0 18px;
  color: var(--suave);
  font-size: 14px;
}

.login-box label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  color: var(--azul);
  margin: 12px 0 4px;
}

.login-box button[type=submit] {
  width: 100%;
  margin-top: 18px;
  padding: 13px;
  font-weight: bold;
}

.erro-login {
  color: var(--vermelho);
  font-size: 13px;
  margin-top: 10px;
  min-height: 16px;
}

@keyframes subir {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}

/* PAINEL */
.painel {
  max-width: 1200px;
  margin: 0 auto;
  padding: 18px 16px 40px;
}

.saudacao {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}

.saudacao h2 {
  margin: 0;
  font-size: 22px;
  color: var(--azul);
}

.saudacao small {
  color: var(--suave);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.ponto-vivo {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 0 0 rgba(34,197,94,.6);
  animation: pulso 2s infinite;
}

@keyframes pulso {
  70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); }
  100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
}

/* RESUMO */
.kpis {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 14px;
}

@media (max-width: 860px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
}

.kpi {
  background: #fff;
  border-radius: 14px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 2px 8px rgba(11,37,69,.06);
  border: 1px solid var(--borda);
}

.kpi .kpi-ic {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  color: var(--cor);
  background: var(--fundo-kpi);
}

.kpi .kpi-ic .ic { width: 22px; height: 22px; }

.kpi strong {
  display: block;
  font-size: 26px;
  line-height: 1;
  color: #111827;
}

.kpi span {
  font-size: 12px;
  color: var(--suave);
}

/* FILTRO POR MOTIVO */
.filtros {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 14px;
}

.chip {
  flex: 0 0 auto;
  background: #fff;
  color: var(--texto);
  border: 1px solid var(--borda);
  border-radius: 20px;
  padding: 7px 12px;
  font-size: 13px;
}

.chip .ic { width: 15px; height: 15px; color: var(--cor, var(--azul)); }

.chip b {
  background: var(--cinza);
  border-radius: 10px;
  padding: 1px 7px;
  font-size: 12px;
}

.chip.ativo {
  background: var(--azul);
  color: #fff;
  border-color: var(--azul);
}

.chip.ativo .ic { color: #fff; }
.chip.ativo b { background: rgba(255,255,255,.2); }

/* DUAS COLUNAS */
.abas-moveis {
  display: none;
  gap: 8px;
  margin-bottom: 12px;
}

.abas-moveis button {
  flex: 1;
  background: #fff;
  color: var(--azul);
  border: 1px solid var(--borda);
}

.abas-moveis button.ativo {
  background: var(--azul);
  color: #fff;
}

.colunas {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  align-items: start;
}

@media (max-width: 860px) {
  .abas-moveis { display: flex; }
  .colunas { grid-template-columns: 1fr; }
  .colunas .lista-painel.oculta-movel { display: none; }
}

.lista-painel {
  background: #fff;
  border-radius: 16px;
  border: 1px solid var(--borda);
  box-shadow: 0 2px 8px rgba(11,37,69,.06);
  overflow: hidden;
}

.lista-topo {
  padding: 14px 14px 10px;
  border-bottom: 1px solid var(--borda);
}

.lista-topo h3 {
  margin: 0 0 10px;
  font-size: 16px;
  color: var(--azul);
  display: flex;
  align-items: center;
  gap: 8px;
}

.lista-topo h3 .contagem {
  background: var(--cor-cont, var(--azul));
  color: #fff;
  font-size: 12px;
  border-radius: 10px;
  padding: 2px 8px;
}

.busca { position: relative; }

.busca .ic {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: #9ca3af;
}

.busca input {
  padding-left: 36px;
  font-size: 14px;
  padding-top: 9px;
  padding-bottom: 9px;
}

.lista {
  max-height: 62vh;
  overflow-y: auto;
  padding: 8px;
}

@media (max-width: 860px) {
  .lista { max-height: none; }
}

.item {
  width: 100%;
  text-align: left;
  background: #fff;
  color: var(--texto);
  border: 1px solid var(--borda);
  border-left: 4px solid var(--cor);
  border-radius: 12px;
  padding: 11px 12px;
  margin-bottom: 8px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  transition: transform .15s, box-shadow .15s, border-color .15s;
  animation: subir .25s ease-out both;
}

.item:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 18px rgba(11,37,69,.10);
}

.item .tipo-ic {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  color: var(--cor);
  background: var(--fundo-tipo);
}

.item-meio { flex: 1; min-width: 0; }

.item-meio strong {
  display: block;
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.item-meio .motivo {
  display: block;
  font-size: 13px;
  color: var(--suave);
  margin-top: 1px;
}

.item-meio .linha-info {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  margin-top: 5px;
  font-size: 12px;
  color: var(--suave);
}

.item-meio .linha-info span {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.item-meio .linha-info .ic { width: 13px; height: 13px; }

.mono {
  font-family: "Courier New", monospace;
  font-weight: bold;
}

.idade {
  flex: 0 0 auto;
  font-size: 11px;
  font-weight: bold;
  padding: 3px 8px;
  border-radius: 10px;
  background: var(--cinza);
  color: var(--suave);
  white-space: nowrap;
}

.idade.alerta { background: #fef3c7; color: #92400e; }
.idade.atrasado { background: #fee2e2; color: #b91c1c; }
.idade.feito { background: #dcfce7; color: var(--verde); }

.novo {
  background: var(--dourado);
  color: #111827;
  font-size: 10px;
  font-weight: bold;
  border-radius: 6px;
  padding: 1px 5px;
  margin-left: 6px;
  vertical-align: 2px;
}

.vazio {
  text-align: center;
  color: var(--suave);
  padding: 36px 16px;
  font-size: 14px;
}

.vazio .ic {
  width: 40px;
  height: 40px;
  color: var(--verde);
  display: block;
  margin: 0 auto 8px;
}

.esqueleto {
  height: 74px;
  border-radius: 12px;
  margin-bottom: 8px;
  background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
  background-size: 200% 100%;
  animation: brilho 1.2s infinite;
}

@keyframes brilho { to { background-position: -200% 0; } }

/* GAVETA DO CHAMADO */
.fundo-gaveta {
  position: fixed;
  inset: 0;
  background: rgba(11,37,69,.45);
  z-index: 20;
  animation: aparecer .2s;
}

@keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }

.gaveta {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(520px, 100%);
  background: #fff;
  z-index: 21;
  display: flex;
  flex-direction: column;
  box-shadow: -20px 0 50px rgba(11,37,69,.25);
  animation: deslizar .28s ease-out;
}

@keyframes deslizar { from { transform: translateX(100%); } to { transform: none; } }

@media (max-width: 640px) {
  .gaveta {
    top: auto;
    height: 92vh;
    border-radius: 18px 18px 0 0;
    animation: deslizarCima .28s ease-out;
  }
  @keyframes deslizarCima { from { transform: translateY(100%); } to { transform: none; } }
}

.gaveta-topo {
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--borda);
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.gaveta-topo .tipo-ic {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cor);
  background: var(--fundo-tipo);
  flex: 0 0 auto;
}

.gaveta-topo .tipo-ic .ic { width: 22px; height: 22px; }

.gaveta-topo h3 {
  margin: 0;
  font-size: 18px;
  color: #111827;
}

.gaveta-topo small {
  display: block;
  color: var(--suave);
  font-size: 13px;
  margin-top: 2px;
}

.gaveta-topo .fechar {
  margin-left: auto;
  background: var(--cinza);
  color: var(--texto);
  padding: 8px;
}

.gaveta-corpo {
  padding: 16px 18px;
  overflow-y: auto;
  flex: 1;
}

.secao {
  margin-bottom: 16px;
}

.secao h4 {
  margin: 0 0 8px;
  font-size: 12px;
  text-transform: uppercase;
  color: var(--suave);
  letter-spacing: .5px;
}

.dado {
  display: flex;
  gap: 10px;
  padding: 7px 0;
  font-size: 14px;
  border-bottom: 1px dashed var(--borda);
}

.dado:last-child { border-bottom: none; }
.dado .ic { color: var(--suave); margin-top: 1px; }
.dado b { display: block; font-size: 12px; color: var(--suave); font-weight: normal; }

.acoes-contato {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.acoes-contato a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  font-size: 13px;
  font-weight: bold;
  padding: 8px 12px;
  border-radius: 10px;
  background: var(--cinza);
  color: var(--azul);
}

.acoes-contato a.whats { background: #dcfce7; color: #166534; }

.descricao {
  background: var(--cinza);
  border-radius: 12px;
  padding: 12px;
  font-size: 14px;
  white-space: pre-wrap;
  line-height: 1.45;
}

.form-atendimento {
  background: linear-gradient(180deg, #f8fafc, #fff);
  border: 1px solid var(--borda);
  border-radius: 14px;
  padding: 14px;
}

.form-atendimento label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  color: var(--azul);
  margin: 10px 0 4px;
}

.form-atendimento label:first-child { margin-top: 0; }

.form-atendimento textarea { min-height: 120px; resize: vertical; }

.respostas {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.respostas button {
  background: #fff;
  color: var(--azul);
  border: 1px dashed var(--azul-claro);
  font-size: 12px;
  padding: 5px 9px;
  border-radius: 14px;
}

.aviso-final {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--suave);
  margin-top: 10px;
}

.aviso-final .ic { width: 15px; height: 15px; }

.campo-erro { border-color: var(--vermelho) !important; background: #fef2f2 !important; }

.gaveta-rodape {
  padding: 12px 18px 16px;
  border-top: 1px solid var(--borda);
  display: flex;
  gap: 8px;
}

.gaveta-rodape .btn-finalizar {
  flex: 1;
  background: var(--verde);
  font-weight: bold;
  padding: 13px;
}

.gaveta-rodape .btn-sec {
  background: var(--cinza);
  color: var(--texto);
}

.msg-erro {
  background: #fef2f2;
  color: #991b1b;
  border-left: 4px solid var(--vermelho);
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 13px;
  margin-top: 10px;
}

.resolvido {
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  border-radius: 14px;
  padding: 14px;
}

.resolvido .dado { border-bottom-color: #bbf7d0; }

/* SUCESSO */
.sucesso {
  text-align: center;
  padding: 30px 10px;
}

.check-anim {
  width: 80px;
  height: 80px;
  display: block;
  margin: 0 auto 10px;
}

.check-anim circle {
  stroke: var(--verde);
  stroke-width: 3;
  stroke-dasharray: 151;
  stroke-dashoffset: 151;
  animation: tracar .6s ease-out forwards;
}

.check-anim path {
  stroke: var(--verde);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 34;
  stroke-dashoffset: 34;
  animation: tracar .35s .5s ease-out forwards;
}

@keyframes tracar { to { stroke-dashoffset: 0; } }

.sucesso h3 { color: var(--verde); margin: 0 0 6px; }
.sucesso p { color: var(--suave); font-size: 14px; margin: 0 0 18px; }

/* SITUAÇÃO: NA FILA / EM ATENDIMENTO */
.kpi.clicavel { cursor: pointer; transition: transform .15s, box-shadow .15s; }
.kpi.clicavel:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(11,37,69,.10); }
.kpi.ativo { border-color: var(--cor); box-shadow: 0 0 0 2px var(--cor) inset; }

.seg {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  margin-bottom: 10px;
  padding-bottom: 2px;
}

.seg button {
  flex: 0 0 auto;
  background: var(--cinza);
  color: var(--texto);
  font-size: 13px;
  padding: 6px 11px;
  border-radius: 18px;
}

.seg button b {
  background: #fff;
  border-radius: 10px;
  padding: 0 6px;
  font-size: 11px;
}

.seg button.ativo { background: var(--azul); color: #fff; }
.seg button.ativo b { background: rgba(255,255,255,.2); }

.lado {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}

.resp {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: bold;
  padding: 3px 8px;
  border-radius: 10px;
  background: #dbeafe;
  color: #1d4ed8;
  white-space: nowrap;
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.resp .ic { width: 12px; height: 12px; }
.resp.meu { background: #1d4ed8; color: #fff; }
.resp.fila { background: #fff7ed; color: #c2410c; }

.faixa-resp {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  color: #1e3a8a;
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 14px;
  margin-bottom: 10px;
}

.faixa-resp b { display: block; font-size: 12px; font-weight: normal; color: #3b82f6; }
.faixa-resp.fila { background: #fff7ed; border-color: #fed7aa; color: #7c2d12; }
.faixa-resp.fila b { color: #c2410c; }

.gaveta-rodape .btn-assumir {
  background: #eff6ff;
  color: #1d4ed8;
  font-weight: bold;
}

.gaveta.sem-anim, .fundo-gaveta.sem-anim { animation: none; }

/* ENCERRAR EM LOTE */
.lista-topo h3 .btn-lote {
  margin-left: auto;
  background: var(--cinza);
  color: var(--azul);
  font-size: 12px;
  padding: 6px 10px;
}

.lista-topo h3 .btn-lote .ic { width: 15px; height: 15px; }
body.lote .lista-topo h3 .btn-lote { background: var(--azul); color: #fff; }

.caixa {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 2px solid #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  margin-top: 7px;
  color: transparent;
  background: #fff;
}

.caixa .ic { width: 14px; height: 14px; }
.item.sel { background: #f0f9ff; border-color: #7dd3fc; }
.lista.parada .item { animation: none; }
.hz-grade.parada .rot { animation: none; }

@media (max-width: 760px) {

.sep-caso {
  display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--borda); border-radius: 12px;
  padding: 10px 12px; margin-bottom: 8px; cursor: pointer; background: #fff;
}
.sep-caso.sel { background: #f0fdf4; border-color: #86efac; }
.sep-caso input { width: 18px; height: 18px; margin-top: 2px; flex: 0 0 auto; accent-color: var(--verde); }
.sep-caso-corpo { flex: 1; min-width: 0; }
.sep-motivo { font-size: 12px; color: #b45309; font-weight: bold; margin-bottom: 6px; }
.sep-motivo.ok { color: var(--verde); }
.sep-par { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 640px) { .sep-par { grid-template-columns: 1fr; } }
.sep-pessoa { background: var(--cinza); border-radius: 10px; padding: 8px 10px; font-size: 13px; min-width: 0; }
.sep-pessoa small { display: block; font-size: 11px; color: var(--suave); }
.sep-pessoa b { display: block; margin: 1px 0 3px; word-break: break-word; }
.sep-pessoa span { display: flex; align-items: center; gap: 5px; color: var(--suave); font-size: 12px; word-break: break-all; }
.sep-pessoa .ic { width: 13px; height: 13px; }
.sep-downloads { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
@media (max-width: 640px) { .sep-downloads { grid-template-columns: 1fr; } }
.sep-baixar {
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--texto);
  border: 1px solid var(--borda); border-left: 4px solid var(--cor); border-radius: 12px; padding: 12px; background: #fff;
}
.sep-baixar:hover { box-shadow: 0 8px 18px rgba(11,37,69,.10); }
.sep-baixar .ic { color: var(--cor); width: 22px; height: 22px; }
.sep-baixar b { display: block; font-size: 13px; word-break: break-word; }
.sep-baixar small { color: var(--suave); font-size: 12px; }
.modal-botoes { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; }
.modal-botoes .btn-sec { background: var(--cinza); color: var(--texto); }
.modal-botoes .btn-ok { background: var(--verde); font-weight: bold; }
.modal {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 21;
  width: min(440px, calc(100% - 32px)); background: #fff; border-radius: 18px; padding: 22px 20px 18px;
  box-shadow: 0 20px 50px rgba(11,37,69,.3); animation: aparecer .2s;
}
.modal-ic { width: 46px; height: 46px; border-radius: 14px; background: #fffbeb; color: #b45309; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
.modal-ic .ic { width: 24px; height: 24px; }
.modal h3 { margin: 0 0 8px; font-size: 18px; color: var(--azul); }
.modal p { margin: 0; font-size: 14px; color: var(--suave); line-height: 1.45; }
.ap-ha { font-size: 13px; color: var(--suave); margin: 2px 0 10px; }

/* VISTORIAS (app de vistoria) */
body.perfil-byd #vsModo { display: none !important; }
body.perfil-master .so-nao-master { display: none !important; }
.vs-modo { margin-bottom: 12px; }
.vs-modo button { font-size: 14px; padding: 8px 14px; font-weight: bold; }
.vs-apagado { opacity: .45; pointer-events: none; }
.vs-lista-painel .lista { max-height: none; }
.item.vs-alerta { background: #fff5f5; border-color: #fecaca; border-left-color: var(--vermelho); }
.item.vs-alerta .tipo-ic { animation: vsPulso 1.6s ease-in-out infinite; }
@keyframes vsPulso { 0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,.35); } 50% { box-shadow: 0 0 0 7px rgba(220,38,38,0); } }
.vs-nc { display: inline-flex; align-items: center; gap: 4px; background: var(--vermelho); color: #fff; font-size: 11px; font-weight: bold; border-radius: 8px; padding: 2px 7px; margin-right: 4px; }
.vs-nc .ic { width: 12px; height: 12px; }
.vs-status { font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 10px; white-space: nowrap; background: var(--fundo-tipo); color: var(--cor); }
.vs-faixa-nc { display: flex; gap: 10px; align-items: flex-start; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; font-size: 14px; }
.vs-faixa-nc .ic { flex: 0 0 auto; margin-top: 1px; }
.vs-faixa-nc b { display: block; }
.vs-faixa-ok { background: #f0fdf4; border-color: #bbf7d0; color: #14532d; }
.vs-nok-item { display: flex; gap: 10px; padding: 8px 10px; border: 1px solid #fecaca; background: #fff5f5; border-radius: 10px; margin-bottom: 6px; font-size: 14px; }
.vs-nok-item .ic { color: var(--vermelho); flex: 0 0 auto; }
.vs-nok-item small { display: block; color: var(--suave); font-size: 12px; }
.vs-cat { font-size: 11px; font-weight: bold; color: var(--azul); background: #fdf1b8; border-radius: 6px; padding: 4px 8px; margin: 10px 0 4px; }
.vs-check { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 6px 8px; border-bottom: 1px solid var(--borda); font-size: 14px; }
.vs-check small { display: block; color: var(--suave); font-size: 12px; }
.vs-check b { font-size: 11px; color: var(--verde); white-space: nowrap; }
.vs-check.nok { background: #fef2f2; }
.vs-check.nok b { color: var(--vermelho); }
.vs-trat-botoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.vs-trat-botoes button { flex: 1; font-weight: bold; }
.vs-trat-botoes .vs-andamento { background: #fff; color: #b45309; border: 1px solid #fcd34d; }
.vs-trat-botoes .vs-concluir { background: var(--verde); }
.vs-acoes { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.vs-acoes button { font-size: 12px; padding: 6px 10px; background: var(--cinza); color: var(--azul); }
.vs-acoes button.perigo { color: var(--vermelho); background: #fef2f2; }
.vs-pessoa { cursor: default; }
/* janela central da vistoria (no lugar da gaveta lateral) */
.gaveta.vs-central {
  top: 50%; left: 50%; right: auto; bottom: auto;
  transform: translate(-50%, -50%);
  width: min(1180px, calc(100% - 40px)); height: min(92vh, 900px);
  border-radius: 18px; overflow: hidden;
  box-shadow: 0 25px 60px rgba(11,37,69,.35);
  animation: vsSurgir .22s ease-out;
}
@keyframes vsSurgir { from { opacity: 0; transform: translate(-50%, -46%); } to { opacity: 1; transform: translate(-50%, -50%); } }
.vs-central .gaveta-corpo { padding: 18px 22px; }
.vs-colunas { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.vs-colunas > div > .secao:first-child { margin-top: 0; }
.vs-central #vsTratTexto { min-height: 170px; }
.vs-central .gaveta-rodape { justify-content: flex-end; }
.vs-central .gaveta-rodape button { flex: 0 0 auto; min-width: 170px; }
@media (max-width: 860px) {
  .gaveta.vs-central { width: 100%; height: 100%; max-height: none; border-radius: 0; }
  .vs-colunas { grid-template-columns: 1fr; }
  .vs-central .gaveta-rodape button { flex: 1; min-width: 0; }
}
.vs-pessoa:hover { transform: none; }

/* IDIOMA (canto superior direito) */
#seletorIdioma { display: flex; align-items: center; gap: 2px; background: var(--cinza); border-radius: 20px; padding: 3px; margin-left: 8px; flex: 0 0 auto; }
header .direita.hidden ~ #seletorIdioma { margin-left: auto; }
#seletorIdioma .idioma-ic { font-size: 13px; padding: 0 3px 0 6px; }
#seletorIdioma button { background: transparent; color: var(--azul); padding: 5px 9px; font-size: 12px; font-weight: bold; border-radius: 16px; }
#seletorIdioma button.ativo { background: var(--azul); color: #fff; }
@media (max-width: 640px) { #seletorIdioma .idioma-ic { display: none; } #seletorIdioma button { padding: 5px 7px; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .check-anim circle, .check-anim path { stroke-dashoffset: 0; }
}
</style>
</head>

<!-- LOGIN -->
<section class="login" id="telaLogin">
  <form class="login-box" onsubmit="entrar(event)">
    <div class="selo"><i data-ic="headset"></i></div>
    <h1>Painel da Equipe</h1>
    <p>Entre para ver e responder os chamados dos passageiros.</p>
    <label for="lNome">Seu nome</label>
    <input type="text" id="lNome" autocomplete="name" maxlength="80" placeholder="Como vai aparecer em Atendimento">
    <label for="lSenha">Senha</label>
    <input type="password" id="lSenha" autocomplete="current-password">
    <button type="submit" id="btnEntrar"><i data-ic="login"></i><span>Entrar</span></button>
    <div class="erro-login" id="erroLogin"></div>
  </form>
</section>

<!-- PAINEL -->
<main class="painel hidden" id="telaPainel">

  <div class="saudacao">

  </div>

  <div class="vistas" role="tablist">
    <button class="ativo" data-vista="chamados" onclick="mostrarVista('chamados')"><i data-ic="inbox"></i>Chamados <span class="badge-vista" id="badgeChamados"></span></button>
    <button data-vista="horarios" onclick="mostrarVista('horarios')"><i data-ic="bus"></i>Horários<span class="so-largo">dos roteiros</span></button>
    <button data-vista="pendencias" onclick="mostrarVista('pendencias')"><i data-ic="alert"></i>Pendências <span class="badge-vista" id="badgePendencias"></span></button>
    <button data-vista="vistorias" onclick="mostrarVista('vistorias')"><i data-ic="clipboard"></i>Vistorias <span class="badge-vista" id="badgeVistorias"></span></button>
    <button data-vista="portal" onclick="mostrarVista('portal')"><i data-ic="upload"></i>Atualizar portal</button>
  </div>

  <div id="vistaChamados">
  <div class="kpis" id="kpis"></div>

  <div class="filtros" id="filtros"></div>

  <div class="abas-moveis">
    <button class="ativo" data-aba="abertos" onclick="abaMovel('abertos')">Em aberto</button>
    <button data-aba="historico" onclick="abaMovel('historico')">Histórico</button>
  </div>
